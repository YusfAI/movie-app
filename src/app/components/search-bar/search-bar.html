<div class="container">
    <div class="search-container">
        <label for="Title">Title</label>
        <input type="text"
            placeholder="ex: Dune, Inception…"
            #movieTitle id="Title"
            [value]="movieService.searchQuery()"
            (input)="onSearch(movieTitle.value)" />
        @if (movieTitle.value) {
            <button type="button" class="clear" aria-label="Clear search" (click)="clear(movieTitle)">
                <fa-icon [icon]="faXmark" />
            </button>
        } @else {
            <fa-icon [icon]="faMagnifyingGlass" />
        }
    </div>
</div>
